<!DOCTYPE html>
<!--
  Page: supplier/job-postings.html
  Route: GET /supplier/job-postings
  Purpose: Read-only list of all buyer job postings available for candidate submission.
  Model attributes expected:
    - jobPostings : List<JobPosting> (id, title, description, startDate, endDate, payRate, status)
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Postings - MiniVMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
  <header th:replace="~{components/header :: app-header(pageTitle='Job Postings')}" class="app-header bg-primary">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" aria-label="Main navigation">
      <div class="container-fluid">
        <!-- Left: brand / logo -->
        <a class="navbar-brand app-logo" href="/" aria-label="MiniVMS home">
          <img src="/assets/logo.svg" alt="MiniVMS logo" width="32" height="32">
          <span>MiniVMS</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#appNavbarCollapse" aria-controls="appNavbarCollapse"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="appNavbarCollapse">
          <!-- Center: page title -->
          <span class="navbar-text page-title mx-auto d-none d-lg-inline">Job Postings</span>

          <!-- Right: account dropdown -->
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item">
              <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center gap-2"
                        type="button" id="account-dropdown-toggle" data-bs-toggle="dropdown"
                        aria-expanded="false" aria-haspopup="true" aria-label="Account menu">
                  <i class="bi bi-person-circle" aria-hidden="true"></i>
                  <span class="d-none d-sm-inline">Jane Doe</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="account-dropdown-toggle">
                  <li class="px-3 py-2">
                    <div class="fw-semibold">Jane Doe</div>
                    <div class="text-muted small">jane.doe@example.com</div>
                  </li>
                  <li><hr class="dropdown-divider"></li>
                  <li>
                    <a class="dropdown-item" href="/profile">
                      <i class="bi bi-person" aria-hidden="true"></i> Profile
                    </a>
                  </li>
                  <li>
                    <form action="/logout" method="post" id="logout-form">
                      <button type="submit" class="dropdown-item">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Logout
                      </button>
                    </form>
                  </li>
                </ul>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <div class="container-fluid app-shell">
    <div class="row">
      <nav class="col-12 col-md-3 col-lg-2 app-sidebar" aria-label="Supplier navigation">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="/supplier/dashboard" th:href="@{/supplier/dashboard}">
              <i class="bi bi-speedometer2" aria-hidden="true"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/supplier/job-seekers" th:href="@{/supplier/job-seekers}">
              <i class="bi bi-person-lines-fill" aria-hidden="true"></i> Job Seekers
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/supplier/job-postings" th:href="@{/supplier/job-postings}" aria-current="page">
              <i class="bi bi-briefcase" aria-hidden="true"></i> Job Postings
            </a>
          </li>
        </ul>
      </nav>

      <main class="col-12 col-md-9 col-lg-10 app-content">
        <h1 class="h3 mb-4">Job Postings</h1>

        <div class="row" th:if="${jobPostings != null and !jobPostings.isEmpty()}">
          <div th:replace="~{components/job-posting-card :: job-posting-card(posting=${posting}, detailsUrlPrefix='/supplier/job-postings/')}"
               th:each="posting : ${jobPostings}"></div>
        </div>

        <div class="empty-state" th:if="${jobPostings == null or jobPostings.isEmpty()}">
          <div class="empty-state-icon"><i class="bi bi-briefcase" aria-hidden="true"></i></div>
          <h2 class="h5">No job postings available</h2>
          <p>Check back later for new opportunities from buyers.</p>
        </div>
      </main>
    </div>
  </div>

  <footer th:replace="~{components/footer :: app-footer}" class="app-footer mt-auto">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span class="text-muted">&copy; 2026 MiniVMS. All rights reserved.</span>
      <span class="text-muted small">Version 1.0.0</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js" th:src="@{/js/main.js}"></script>
</body>
</html>
