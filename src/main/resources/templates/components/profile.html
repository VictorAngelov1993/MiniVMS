<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - MiniVMS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body>

<header th:replace="~{components/header :: app-header(pageTitle='Profile')}" class="app-header bg-primary"></header>

<div class="container-fluid app-shell">
  <div class="row">

    <!-- Sidebar (same style as dashboard) -->
    <nav class="col-12 col-md-3 col-lg-2 app-sidebar" aria-label="Profile navigation">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link" th:href="${user.roleHomeUrl}">
            <i class="bi bi-house" aria-hidden="true"></i> Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="/profile" th:href="@{/profile}" aria-current="page">
            <i class="bi bi-person" aria-hidden="true"></i> Profile
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main content -->
    <main class="col-12 col-md-9 col-lg-10 app-content">
      <h1 class="h3 mb-4">Profile</h1>

      <div class="card shadow-sm">
        <div class="card-body">

          <div class="d-flex align-items-center mb-4">
            <i class="bi bi-person-circle fs-1 me-3"></i>
            <div>
              <h4 class="mb-0" th:text="${user.fullName}">John Doe</h4>
              <div class="text-muted" th:text="${user.email}">john.doe@example.com</div>
            </div>
          </div>

          <hr>

          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <div th:text="${user.fullName}">John Doe</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <div th:text="${user.email}">john.doe@example.com</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <div th:text="${user.role}">Buyer</div>
          </div>

          <hr>

          <div class="d-flex justify-content-between">
            <a th:href="${user.roleHomeUrl}" class="btn btn-secondary">
              <i class="bi bi-arrow-left"></i> Back
            </a>

            <form action="/logout" method="post" th:action="@{/logout}">
              <input type="hidden" name="_csrf" th:if="${_csrf}" th:value="${_csrf.token}"/>
              <button class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
              </button>
            </form>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<footer th:replace="~{components/footer :: app-footer}" class="app-footer mt-auto"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js" th:src="@{/js/main.js}"></script>

</body>
</html>
