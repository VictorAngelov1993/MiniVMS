<!--
  Component: workorder-card.html
  Purpose: Card layout for a single work order, used in /buyer/workorders list page.
  Thymeleaf usage:
    <div th:replace="~{components/workorder-card :: workorder-card(workorder=${wo})}"
         th:each="wo : ${workOrders}"></div>
  Placeholders (server-rendered):
    - workorder.id, workorder.status, workorder.assignedWorkerName,
      workorder.startDate, workorder.endDate
-->
<div th:fragment="workorder-card(workorder)" class="col-12 col-md-6 col-lg-4 mb-4">
  <a class="link-plain" href="/buyer/workorders/1" th:href="@{'/buyer/workorders/' + ${workorder.id}}"
     aria-label="View work order details">
    <div class="card card-compact card-clickable h-100">
      <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h3 class="card-title h6 mb-0">
            WO-<span th:text="${workorder.id}">1001</span>
          </h3>
          <span class="badge status-badge bg-info text-dark" th:text="${workorder.status}">Active</span>
        </div>
        <p class="card-text small mb-1">
          <i class="bi bi-person" aria-hidden="true"></i>
          Assigned: <span th:text="${workorder.assignedWorkerName}">John Smith</span>
        </p>
        <ul class="list-unstyled small text-muted mb-0">
          <li>
            <i class="bi bi-calendar-event" aria-hidden="true"></i>
            <span th:text="${workorder.startDate}">2026-01-01</span> &ndash;
            <span th:text="${workorder.endDate}">2026-06-30</span>
          </li>
        </ul>
      </div>
    </div>
  </a>
</div>
