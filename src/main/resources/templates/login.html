<!DOCTYPE html>
<!--
  Page: login.html
  Route: GET /login (render form), POST /login (submit form, server authenticates
         and redirects based on role: /buyer/dashboard, /supplier/dashboard, /worker/dashboard)
  Expected form fields: username, password, rememberMe (checkbox, optional)
  Server should set model attribute `loginError` (boolean/string) on failed auth.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MiniVMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a class="app-logo justify-content-center mb-3" href="/" th:href="@{/}">
        <img src="/assets/logo.svg" th:src="@{/assets/logo.svg}" alt="MiniVMS logo" width="40" height="40">
        <span class="fs-4">MiniVMS</span>
      </a>
      <h1 class="h4 text-center mb-4">Sign in to your account</h1>

      <!-- Inline error area for invalid credentials -->
      <div class="alert alert-danger form-error-alert d-none" role="alert" aria-live="assertive"></div>
      <div class="alert alert-danger" role="alert" th:if="${loginError}">
        Invalid username or password. Please try again.
      </div>

      <form action="/login" method="post" th:action="@{/login}" data-validate novalidate>
        <input type="hidden" name="_csrf" th:if="${_csrf}" th:value="${_csrf.token}"/>

        <div class="mb-3">
          <label for="username" class="form-label">Username<span class="required-marker">*</span></label>
          <input type="text" class="form-control" id="username" name="username" required
                 autocomplete="username" autofocus aria-required="true">
          <div class="invalid-feedback">Username is required.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password<span class="required-marker">*</span></label>
          <input type="password" class="form-control" id="password" name="password" required
                 autocomplete="current-password" aria-required="true">
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe" value="true">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <p class="text-center small text-muted mt-3">
        Don't have an account? <a href="/register" th:href="@{/register}">Register here</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js" th:src="@{/js/main.js}"></script>
</body>
</html>
