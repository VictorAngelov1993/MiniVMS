<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - MiniVMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<main class="container d-flex flex-column justify-content-center align-items-center text-center flex-grow-1">
    <div class="mb-4">
        <i class="bi bi-shield-exclamation text-danger" style="font-size: 4rem;"></i>
    </div>

    <h1 class="h3 mb-3">Access Denied</h1>
    <p class="text-muted mb-4">
        You do not have permission to view this page.<br>
        Please check your account role or return to your dashboard.
    </p>

    <a class="btn btn-primary" href="/" th:href="@{/}">
        <i class="bi bi-house-door" aria-hidden="true"></i> Go to Home
    </a>
</main>

<footer class="app-footer mt-auto py-3 bg-white border-top">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
        <span class="text-muted">&copy; 2026 MiniVMS. All rights reserved.</span>
        <span class="text-muted small">Version 1.0.0</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
