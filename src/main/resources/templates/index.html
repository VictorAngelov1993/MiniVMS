<!DOCTYPE html>
<!--
  Page: index.html (landing page)
  Route: GET /
  Purpose: Public landing page with links to Login and Register.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniVMS - Vendor Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card text-center">
      <span class="app-logo justify-content-center mb-3">
        <img src="/assets/logo.svg" th:src="@{/assets/logo.svg}" alt="MiniVMS logo" width="48" height="48">
        <span class="fs-3">MiniVMS</span>
      </span>
      <p class="text-muted mb-4">A simple Vendor Management System for Buyers, Suppliers and Workers.</p>
      <div class="d-grid gap-2">
        <a class="btn btn-primary btn-lg" href="/login" th:href="@{/login}">Login</a>
        <a class="btn btn-outline-primary btn-lg" href="/register" th:href="@{/register}">Register</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js" th:src="@{/js/main.js}"></script>
</body>
</html>
